<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormLattice — schema-driven React forms</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
      }
      .app {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .field {
        display: block;
        margin-bottom: 1rem;
      }
      .field span {
        display: block;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 0.5rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.875rem;
      }
      button {
        padding: 0.5rem 1rem;
        font-size: 1rem;
        cursor: pointer;
      }
      .output {
        background: rgba(127, 127, 127, 0.15);
        padding: 1rem;
        border-radius: 0.5rem;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
